# TEMPLATE: the model names below are one author's fleet, not defaults that will work
# for you. Replace every spec with models your own accounts can run, then test the
# seats with:  python council.py --config <this file> --check
# Default council: strong thinkers + free volume models.
# Spec format: "<backend>:<model>[@effort]"  (see council.py docstring)
# Members without a `role` get a lens (precision / breadth / skeptic) round-robin.

[council]
language = "English"
timeout_s = 1800
reviewers = [
  "agy:gemini-4-argon-high",
  "codex:gpt-6.1-sol@xhigh",
  "agy:claude-opus-5-5-high",
]
boss = "agy:claude-opus-5-5-high"   # "none" = stop after reviews (caller synthesizes)
boss_fallback = "codex:gpt-6.1-sol@xhigh"   # if the chair fails (e.g. quota), try this once
# fallback = "codex:gpt-6.1-sol@high"     # optional: any failed member/reviewer tries this
# retries = 1                              # extra tries per seat (timeouts are not retried)

[[member]]
spec = "codex:gpt-6.1-sol@xhigh"

[[member]]
spec = "agy:gemini-4-argon-high"

[[member]]
spec = "agy:claude-opus-5-5-high"

[[member]]
spec = "opencode:opencode/glm-5.3-flash-free@max"

[[member]]
spec = "opencode:opencode/deepseek-v4.1-flash-free@max"
